<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#18181d"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eed596"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8862c"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9cf8b"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <path id="arcTop" d="M 256 256 m -188 0 a 188 188 0 1 1 376 0" fill="none"/>
    <path id="arcBot" d="M 256 256 m -188 0 a 188 188 0 1 0 376 0" fill="none"/>
  </defs>

  <!-- Fondo del sello -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="250" fill="none" stroke="#26262c" stroke-width="2"/>

  <!-- Anillos dorados -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>

  <!-- Monograma central -->
  <text x="256" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="172" font-style="italic" font-weight="700" fill="url(#gold)">R</text>

  <!-- Texto curvo -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="37" font-weight="700" letter-spacing="12" fill="url(#goldSoft)">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">ROGASA</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="16" fill="url(#goldSoft)" opacity="0.92">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">CAFÉ</textPath>
  </text>
</svg>
